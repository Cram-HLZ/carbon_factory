<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>碳排热力图 · 碳排AI监测系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="app.js"></script>
<style>
  body{background:#f5f6f8;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .navbar-brand{font-weight:700}
  .card{border:none;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card-title{font-size:14px;font-weight:600;color:#374151;padding:14px 16px 0}
  #heatmap{height:660px}
  .stat{font-size:13px;color:#6b7280}
  .stat b{color:#0f766e;font-size:18px}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#0f766e">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🌿 数字孪生锂电工厂 · 碳排AI监测</a>
    <div class="navbar-nav">
      <a class="nav-link" href="overview.html">厂区总览</a>
      <a class="nav-link active" href="heatmap.html">碳排热力图</a>
      <a class="nav-link" href="realtime.html">设备实时</a>
    </div>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <span class="navbar-text small" id="connBadge">后端: 8001</span>
      <span class="navbar-text small d-flex align-items-center gap-2" id="userBar"></span>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  <div class="d-flex align-items-end justify-content-between mb-3 flex-wrap gap-2">
    <h5 class="mb-0">碳排热力图 <small class="text-secondary fs-6">（车间 × 设备 · 颜色越深碳排越高）</small></h5>
    <div class="d-flex align-items-center gap-2">
      <input type="datetime-local" class="form-control form-control-sm" id="startTime">
      <span class="text-secondary small">至</span>
      <input type="datetime-local" class="form-control form-control-sm" id="endTime">
      <button class="btn btn-sm btn-success" onclick="load()">查询</button>
      <button class="btn btn-sm btn-outline-secondary" onclick="useSample()">示例时间窗口</button>
    </div>
  </div>

  <div class="alert alert-warning d-none" id="emptyAlert"></div>

  <div class="row g-3 mb-3">
    <div class="col-6 col-lg-3"><div class="card" style="padding:14px 18px"><div class="stat">设备数<b> <span id="statCount">—</span></b></div></div></div>
    <div class="col-6 col-lg-3"><div class="card" style="padding:14px 18px"><div class="stat">总碳排 (kgCO₂)<b> <span id="statTotal">—</span></b></div></div></div>
    <div class="col-6 col-lg-3"><div class="card" style="padding:14px 18px"><div class="stat">最大碳排设备<b> <span id="statMax">—</span></b></div></div></div>
    <div class="col-6 col-lg-3"><div class="card" style="padding:14px 18px"><div class="stat">平均功率 (kW)<b> <span id="statPower">—</span></b></div></div></div>
  </div>

  <div class="card"><div id="heatmap"></div></div>
</div>

<script>
const BASE = 'http://localhost:8001/api';

// 车间中文名（算法 heatmap records 只给 workshop_id，前端补名称）
const WORKSHOPS = {
  'WS-01': '电芯制备车间', 'WS-02': '电芯化成车间', 'WS-03': '电芯检测分选车间',
  'WS-04': '模具加工车间', 'WS-05': '物流动力区',
};

const chart = echarts.init(document.getElementById('heatmap'));
window.addEventListener('resize', () => chart.resize());

function showError(msg) {
  const el = document.getElementById('emptyAlert');
  el.textContent = '⚠ ' + msg;
  el.classList.remove('d-none', 'alert-warning');
  el.classList.add('alert-danger');
}
function showEmpty(msg) {
  const el = document.getElementById('emptyAlert');
  el.textContent = '该时间范围内暂无数据：' + (msg || '请确认 raw_data 目录或调整时间范围');
  el.classList.remove('d-none', 'alert-danger');
  el.classList.add('alert-warning');
}

// 默认时间窗口 = 最近 7 天（对齐样本数据窗口）
function toLocalInput(d) {
  const p = n => String(n).padStart(2, '0');
  return `${d.getFullYear()}-${p(d.getMonth() + 1)}-${p(d.getDate())}T${p(d.getHours())}:${p(d.getMinutes())}`;
}
function defaultRange() {
  const end = new Date();
  const start = new Date(end.getTime() - 7 * 24 * 3600 * 1000);
  return { start: toLocalInput(start), end: toLocalInput(end) };
}
function useSample() {
  const r = defaultRange();
  document.getElementById('startTime').value = r.start;
  document.getElementById('endTime').value = r.end;
  load();
}

function padLocal(v) {
  // datetime-local 值形如 "2026-08-15T00:00"，补秒成合法 ISO
  return v && v.length === 16 ? v + ':00' : v;
}

async function load() {
  document.getElementById('emptyAlert').classList.add('d-none');
  const start = padLocal(document.getElementById('startTime').value);
  const end = padLocal(document.getElementById('endTime').value);
  if (!start || !end) { showError('请选择起始/结束时间'); return; }
  try {
    const url = `${BASE}/carbon/heatmap?start_time=${encodeURIComponent(start)}&end_time=${encodeURIComponent(end)}`;
    const resp = await fetch(url);
    const json = await resp.json();
    if (json.code !== 200) { showError(json.message || ('code=' + json.code)); return; }
    const d = json.data || {};
    const records = d.records || [];
    if (records.length === 0) { showEmpty(d.message); return; }
    render(records, d.count);
    document.getElementById('connBadge').textContent = '已连接 · ' + records.length + ' 台设备';
    document.getElementById('connBadge').className = 'navbar-text small text-success';
  } catch (e) {
    showError('无法连接后端 8001：' + e.message);
    document.getElementById('connBadge').textContent = '后端未连接';
    document.getElementById('connBadge').className = 'navbar-text small text-danger';
  }
}

function render(records, count) {
  // 统计
  const total = records.reduce((s, r) => s + (r.carbon_emission || 0), 0);
  const maxR = records.slice().sort((a, b) => b.carbon_emission - a.carbon_emission)[0];
  const powerMean = records.reduce((s, r) => s + (r.power_mean || 0), 0) / (records.length || 1);
  document.getElementById('statCount').textContent = count != null ? count : records.length;
  document.getElementById('statTotal').textContent = total.toLocaleString('zh-CN', { maximumFractionDigits: 1 });
  document.getElementById('statMax').textContent = maxR ? (maxR.equipment_name || maxR.equipment_id) : '—';
  document.getElementById('statPower').textContent = powerMean.toFixed(2);

  // 热力图：x = 车间（5 列），y = 设备（行），值 = 碳排
  const wsOrder = Object.keys(WORKSHOPS); // 稳定列顺序
  const sorted = records.slice().sort((a, b) => {
    const w = wsOrder.indexOf(a.workshop_id) - wsOrder.indexOf(b.workshop_id);
    return w !== 0 ? w : (a.equipment_id < b.equipment_id ? -1 : 1);
  });
  const xCats = wsOrder.map(w => WORKSHOPS[w]);
  const yCats = sorted.map(r => `${r.equipment_name || r.equipment_id}\n(${r.equipment_id})`);
  const data = sorted.map((r, yi) => [wsOrder.indexOf(r.workshop_id), yi, r.carbon_emission]);
  const maxVal = Math.max(1, ...records.map(r => r.carbon_emission || 0));

  chart.setOption({
    tooltip: {
      position: 'top',
      formatter: p => {
        const r = sorted[p.value[1]];
        return `<b>${r.equipment_name || r.equipment_id}</b>（${r.equipment_id}）<br/>`
          + `车间：${WORKSHOPS[r.workshop_id] || r.workshop_id}<br/>`
          + `碳排：${(r.carbon_emission).toLocaleString('zh-CN')} kgCO₂<br/>`
          + `平均功率：${r.power_mean} kW · 运行时数：${r.runtime}`;
      },
    },
    grid: { left: 10, right: 10, top: 10, bottom: 60, containLabel: true },
    xAxis: { type: 'category', data: xCats, splitArea: { show: true }, axisLabel: { interval: 0 } },
    yAxis: { type: 'category', data: yCats, splitArea: { show: true }, axisLabel: { fontSize: 10, lineHeight: 12 } },
    visualMap: {
      min: 0, max: maxVal, calculable: true, orient: 'horizontal',
      left: 'center', bottom: 0, text: ['高碳排', '低碳排'],
      inRange: { color: ['#e0f2fe', '#10b981', '#0f766e', '#7c3aed'] },
    },
    series: [{
      type: 'heatmap', data: data,
      label: { show: false },
      itemStyle: { borderColor: '#fff', borderWidth: 1 },
      emphasis: { itemStyle: { shadowBlur: 8, shadowColor: 'rgba(0,0,0,.4)' } },
    }],
  }, true);
}

// 初始化默认时间
const _initRange = defaultRange();
document.getElementById('startTime').value = _initRange.start;
document.getElementById('endTime').value = _initRange.end;
load();
</script>
</body>
</html>
