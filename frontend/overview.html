<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>厂区碳排总览 · 碳排AI监测系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<script src="https://cdn.jsdelivr.net/npm/echarts@5.5.0/dist/echarts.min.js"></script>
<script src="app.js"></script>
<style>
  body{background:#f5f6f8;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .navbar-brand{font-weight:700}
  .card{border:none;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
  .card-title{font-size:14px;font-weight:600;color:#374151;padding:14px 16px 0}
  .chart{height:340px}
  .kpi{border-left:4px solid #10b981;padding:16px 20px}
  .kpi .label{font-size:12px;color:#6b7280}
  .kpi .value{font-size:24px;font-weight:700;color:#0f766e}
  .kpi .sub{font-size:12px;color:#9ca3af}
  .spinner{color:#0f766e}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#0f766e">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🌿 数字孪生锂电工厂 · 碳排AI监测</a>
    <div class="navbar-nav">
      <a class="nav-link active" href="overview.html">厂区总览</a>
      <a class="nav-link" href="heatmap.html">碳排热力图</a>
      <a class="nav-link" href="realtime.html">设备实时</a>
    </div>
    <div class="d-flex align-items-center gap-3 ms-auto">
      <span class="navbar-text small" id="connBadge">后端: 8001</span>
      <span class="navbar-text small d-flex align-items-center gap-2" id="userBar"></span>
    </div>
  </div>
</nav>

<div class="container-fluid py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="mb-0">厂区碳排总览</h5>
    <button class="btn btn-sm btn-outline-success" onclick="load()">刷新数据</button>
  </div>

  <!-- 空数据提示 -->
  <div class="alert alert-warning d-none" id="emptyAlert"></div>

  <!-- KPI 指标卡 -->
  <div class="row g-3 mb-3" id="kpiRow">
    <div class="col-6 col-lg-3"><div class="card kpi"><div class="label">总碳排 (kgCO₂)</div><div class="value" id="kpiEmission">—</div><div class="sub" id="kpiEmissionSub"></div></div></div>
    <div class="col-6 col-lg-3"><div class="card kpi"><div class="label">总能耗 (kWh)</div><div class="value" id="kpiEnergy">—</div><div class="sub" id="kpiEnergySub"></div></div></div>
    <div class="col-6 col-lg-3"><div class="card kpi"><div class="label">覆盖车间数</div><div class="value" id="kpiWorkshop">—</div><div class="sub">按车间维度</div></div></div>
    <div class="col-6 col-lg-3"><div class="card kpi"><div class="label">覆盖班组数</div><div class="value" id="kpiTeam">—</div><div class="sub">按班组维度</div></div></div>
  </div>

  <!-- 车间 / 班组 -->
  <div class="row g-3 mb-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-title">车间碳排排名</div>
        <div class="chart" id="workshopChart"></div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-title">班组碳排占比</div>
        <div class="chart" id="teamChart"></div>
      </div>
    </div>
  </div>

  <!-- 设备 Top10 / 小时趋势 -->
  <div class="row g-3">
    <div class="col-lg-6">
      <div class="card">
        <div class="card-title">高碳排设备 Top10</div>
        <div class="chart" id="topChart"></div>
      </div>
    </div>
    <div class="col-lg-6">
      <div class="card">
        <div class="card-title">按小时碳排趋势</div>
        <div class="chart" id="trendChart"></div>
      </div>
    </div>
  </div>
</div>

<script>
const BASE = 'http://localhost:8001/api';

// 设备类型 → 中文名（用于 Top10 图 tooltip 增强可读性）
const TYPE_NAMES = {
  appearance_inspector: '外观检测机', dimension_inspector: '尺寸检测机',
  winding_machine: '卷绕机', formation_cabinet: '化成柜', sorting_machine: '分选机',
  conveyor_line: '输送线', baking_oven: '烘烤炉', agv: 'AGV',
  cnc_milling_machine: '龙门铣床', compressor: '空压机', cooling_fan: '冷却风机', chiller: '冷水机组',
};

const charts = {};
function initChart(id) {
  const el = document.getElementById(id);
  charts[id] = echarts.init(el);
  return charts[id];
}
const workshopChart = initChart('workshopChart');
const teamChart = initChart('teamChart');
const topChart = initChart('topChart');
const trendChart = initChart('trendChart');
window.addEventListener('resize', () => Object.values(charts).forEach(c => c.resize()));

function showError(msg) {
  const el = document.getElementById('emptyAlert');
  el.textContent = '⚠ ' + msg;
  el.classList.remove('d-none');
  el.classList.add('alert-danger');
}

function showEmpty(msg) {
  const el = document.getElementById('emptyAlert');
  el.textContent = '暂无数据：' + (msg || 'raw_data 目录无数据，请先运行 python data/generate_sample_data.py');
  el.classList.remove('d-none', 'alert-danger');
  el.classList.add('alert-warning');
}

async function load() {
  document.getElementById('emptyAlert').classList.add('d-none');
  try {
    const resp = await fetch(BASE + '/carbon/overview');
    const json = await resp.json();
    if (json.code !== 200) { showError(json.message || ('code=' + json.code)); return; }
    const d = json.data || {};
    renderKpi(d);
    renderWorkshop(d.by_workshop || []);
    renderTeam(d.by_team || []);
    renderTop(d.by_equipment_top || []);
    renderTrend(d.hourly_trend || []);
    if (d.message && (!d.by_workshop || d.by_workshop.length === 0)) showEmpty(d.message);
    document.getElementById('connBadge').textContent = '已连接 · 数据实时';
    document.getElementById('connBadge').className = 'navbar-text small text-success';
  } catch (e) {
    showError('无法连接后端 8001：' + e.message);
    document.getElementById('connBadge').textContent = '后端未连接';
    document.getElementById('connBadge').className = 'navbar-text small text-danger';
  }
}

function fmt(v) {
  return Number(v).toLocaleString('zh-CN', { maximumFractionDigits: 1 });
}

function renderKpi(d) {
  document.getElementById('kpiEmission').textContent = fmt(d.total_emission);
  document.getElementById('kpiEmissionSub').textContent = '≈ ' + fmt(d.total_emission / 1000) + ' 吨';
  document.getElementById('kpiEnergy').textContent = fmt(d.total_energy);
  document.getElementById('kpiEnergySub').textContent = '≈ ' + fmt(d.total_energy / 1000) + ' MWh';
  document.getElementById('kpiWorkshop').textContent = (d.by_workshop || []).length;
  document.getElementById('kpiTeam').textContent = (d.by_team || []).length;
}

function renderWorkshop(ws) {
  const cats = ws.map(x => x.workshop_name || x.workshop_id);
  const vals = ws.map(x => x.carbon_emission);
  workshopChart.setOption({
    grid: { left: 16, right: 20, top: 10, bottom: 8, containLabel: true },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' } },
    xAxis: { type: 'value', name: 'kgCO₂' },
    yAxis: { type: 'category', data: cats, inverse: true },
    series: [{
      type: 'bar', data: vals, barMaxWidth: 26,
      itemStyle: { color: '#10b981', borderRadius: [0, 4, 4, 0] },
      label: { show: true, position: 'right', formatter: p => fmt(p.value) },
    }],
  }, true);
}

function renderTeam(tm) {
  teamChart.setOption({
    tooltip: { trigger: 'item', formatter: '{b}: {c} kgCO₂ ({d}%)' },
    legend: { bottom: 0 },
    series: [{
      type: 'pie', radius: ['40%', '68%'],
      data: tm.map(x => ({ name: x.team_name || x.team_id, value: x.carbon_emission })),
      label: { formatter: '{b}\n{d}%' },
      color: ['#0f766e', '#10b981', '#f59e0b'],
    }],
  }, true);
}

function renderTop(eq) {
  const cats = eq.map(x => x.equipment_id);
  const values = eq.map(x => x.carbon_emission);
  topChart.setOption({
    grid: { left: 16, right: 20, top: 10, bottom: 8, containLabel: true },
    tooltip: {
      trigger: 'axis', axisPointer: { type: 'shadow' },
      formatter: ps => {
        const i = ps[0].dataIndex;
        const t = TYPE_NAMES[eq[i].equipment_type] || eq[i].equipment_type;
        return `${eq[i].equipment_id}（${t}）<br/>碳排：${fmt(eq[i].carbon_emission)} kgCO₂`;
      },
    },
    xAxis: { type: 'category', data: cats, axisLabel: { rotate: 40 } },
    yAxis: { type: 'value', name: 'kgCO₂' },
    series: [{
      type: 'bar', data: values, barMaxWidth: 22,
      itemStyle: { color: '#f59e0b', borderRadius: [4, 4, 0, 0] },
    }],
  }, true);
}

function renderTrend(trend) {
  const labels = trend.map(x => (x.timestamp || '').replace('T', ' ').slice(5, 16));
  const carbon = trend.map(x => x.carbon_emission);
  const energy = trend.map(x => x.energy_consumption);
  trendChart.setOption({
    tooltip: { trigger: 'axis' },
    legend: { data: ['碳排 (kgCO₂)', '能耗 (kWh)'], bottom: 0 },
    grid: { left: 16, right: 20, top: 30, bottom: 40, containLabel: true },
    xAxis: { type: 'category', data: labels, axisLabel: { interval: Math.ceil(labels.length / 12) } },
    yAxis: [
      { type: 'value', name: '碳排' },
      { type: 'value', name: '能耗' },
    ],
    series: [
      { name: '碳排 (kgCO₂)', type: 'line', smooth: true, data: carbon, itemStyle: { color: '#0f766e' }, areaStyle: { opacity: .12 } },
      { name: '能耗 (kWh)', type: 'line', smooth: true, yAxisIndex: 1, data: energy, itemStyle: { color: '#f59e0b' } },
    ],
  }, true);
}

load();
</script>
</body>
</html>
