<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>用户与角色管理 · 碳排AI监测系统</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
<style>
  body{background:#f5f6f8;font-family:-apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
  .navbar-brand{font-weight:700}
  .card{border:none;border-radius:12px;box-shadow:0 1px 4px rgba(0,0,0,.06)}
</style>
</head>
<body>
<nav class="navbar navbar-expand-lg navbar-dark" style="background:#0f766e">
  <div class="container-fluid">
    <a class="navbar-brand" href="#">🌿 数字孪生锂电工厂 · 碳排AI监测</a>
    <div class="navbar-nav me-auto">
      <a class="nav-link" href="overview.html">厂区总览</a>
      <a class="nav-link" href="heatmap.html">碳排热力图</a>
      <a class="nav-link" href="realtime.html">设备实时</a>
      <a class="nav-link active" href="users.html">用户管理</a>
    </div>
    <span class="navbar-text small d-flex align-items-center gap-2" id="userBar"></span>
  </div>
</nav>

<div class="container-fluid py-4">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <h5 class="mb-0">用户与角色管理 <small class="text-secondary fs-6">（管理层 / 运维岗 / IT管理员）</small></h5>
    <span class="small text-secondary">仅 IT管理员可访问</span>
  </div>

  <div class="alert alert-danger d-none" id="err"></div>

  <!-- 新建用户 -->
  <div class="card mb-3" style="padding:16px 20px">
    <div class="row g-2 align-items-end">
      <div class="col-6 col-md-2"><label class="form-label small mb-1">账号</label><input class="form-control form-control-sm" id="nAccount" placeholder="如 zhangsan"></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-1">初始密码</label><input class="form-control form-control-sm" id="nPassword" type="password" placeholder="≥6 位"></div>
      <div class="col-6 col-md-2"><label class="form-label small mb-1">角色</label><select class="form-select form-select-sm" id="nRole"></select></div>
      <div class="col-6 col-md-2"><button class="btn btn-sm btn-success" onclick="createUser()">新增用户</button></div>
    </div>
  </div>

  <!-- 用户列表 -->
  <div class="card" style="padding:16px 20px">
    <table class="table align-middle mb-0">
      <thead><tr><th>ID</th><th>账号</th><th>角色</th><th>权限</th><th style="width:280px">操作</th></tr></thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>
</div>

<script src="app.js"></script>
<script>
// ROLE_NAMES 已在 app.js 中定义，此处直接复用

function showErr(m) {
  const el = document.getElementById('err');
  el.textContent = m;
  el.classList.remove('d-none');
}
function clearErr() { document.getElementById('err').classList.add('d-none'); }

async function loadRoles() {
  const resp = await fetch(API_BASE + '/auth/roles');
  const json = await resp.json();
  document.getElementById('nRole').innerHTML =
    Object.keys(json).map(k => `<option value="${k}">${json[k].name}</option>`).join('');
}

async function loadUsers() {
  const resp = await fetch(API_BASE + '/auth/users');
  const json = await resp.json();
  if (resp.status === 403) { showErr(json.detail || '仅 IT管理员可管理用户'); return; }
  if (!Array.isArray(json)) { showErr(json.detail || '加载失败'); return; }
  clearErr();
  document.getElementById('tbody').innerHTML = json.map(u => {
    const roleSel = Object.keys(ROLE_NAMES).map(r =>
      `<option value="${r}" ${u.role === r ? 'selected' : ''}>${ROLE_NAMES[r]}</option>`).join('');
    const perms = (u.permissions || []).join(', ') || '—';
    return `<tr>
      <td>${u.id}</td>
      <td>${u.account}</td>
      <td>${ROLE_NAMES[u.role] || u.role}</td>
      <td class="small text-secondary">${perms}</td>
      <td>
        <div class="d-flex gap-2 align-items-center">
          <select class="form-select form-select-sm" id="role_${u.id}">${roleSel}</select>
          <button class="btn btn-sm btn-outline-primary" onclick="updateRole(${u.id})">改角色</button>
          <button class="btn btn-sm btn-outline-danger" onclick="delUser(${u.id}, this)">删除</button>
        </div>
      </td>
    </tr>`;
  }).join('');
}

async function createUser() {
  const account = document.getElementById('nAccount').value.trim();
  const password = document.getElementById('nPassword').value;
  const role = document.getElementById('nRole').value;
  if (!account || !password) { showErr('请填写账号和密码'); return; }
  const resp = await fetch(API_BASE + '/auth/users', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ account, password, role }),
  });
  const json = await resp.json();
  if (resp.status !== 201) { showErr(json.detail || '创建失败'); return; }
  clearErr();
  document.getElementById('nAccount').value = '';
  document.getElementById('nPassword').value = '';
  loadUsers();
}

async function updateRole(id) {
  const role = document.getElementById('role_' + id).value;
  const resp = await fetch(API_BASE + '/auth/users/' + id, {
    method: 'PUT',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ role }),
  });
  const json = await resp.json();
  if (resp.status !== 200) { showErr(json.detail || '更新失败'); return; }
  clearErr();
  loadUsers();
}

async function delUser(id, btn) {
  const account = btn.closest('tr').children[1].textContent;
  if (!confirm('确认删除用户 ' + account + ' ？')) return;
  const resp = await fetch(API_BASE + '/auth/users/' + id, { method: 'DELETE' });
  const json = await resp.json();
  if (resp.status !== 200) { showErr(json.detail || '删除失败'); return; }
  clearErr();
  loadUsers();
}

loadRoles();
loadUsers();
</script>
</body>
</html>
