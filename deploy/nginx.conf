server {
    listen 80;
    server_name _;

    # 前端静态资源 + SPA fallback
    root /usr/share/nginx/html;
    index index.html;
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 后端 HTTP 接口
    location /api/ {
        proxy_pass http://backend:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # AI 助手 SSE 流式（最长前缀优先于 /api/）：
    # 必须 proxy_buffering off，否则流式响应被 nginx 缓冲成"一次性吐出"，打字机效果失效；
    # 放宽读写超时，避免模型多轮工具调用期间连接被掐断
    location /api/agent/chat/stream {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
    }

    # 后端接口文档
    location /docs { proxy_pass http://backend:8001; }
    location /openapi.json { proxy_pass http://backend:8001; }

    # WebSocket 实时告警推送（必须带 Upgrade 头）
    location /ws/ {
        proxy_pass http://backend:8001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }
}