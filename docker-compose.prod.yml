# 生产环境覆盖层：容器重启策略 + 对外仅暴露 web 的 8080（备案未通过时先用 IP:8080 访问）
# 用法：docker compose -f docker-compose.yml -f docker-compose.prod.yml up -d --build
# 注意：ports 的 !override 需要 Docker Compose v2.24+（Ubuntu 24.04 自带版本满足）
services:
  algo:
    restart: unless-stopped

  backend:
    restart: unless-stopped

  web:
    restart: unless-stopped
    ports: !override
      - "8080:80"
