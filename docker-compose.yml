services:
  algo:
    build:
      context: .
      dockerfile: deploy/Dockerfile.algo
    networks: [app]

  backend:
    build:
      context: .
      dockerfile: deploy/Dockerfile.backend
    environment:
      # 跨容器调用算法，覆盖默认的 localhost
      ALGO_BASE: http://algo:8000/api/v1
      # JWT 签名密钥，生产必须设置为强随机值（见 .env）
      AUTH_SECRET_KEY: ${AUTH_SECRET_KEY}
      # 邮件 SMTP
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_FROM: ${SMTP_FROM}
      SMTP_TO: ${SMTP_TO}
      # 移动端推送（PushPlus / Server酱）
      PUSH_TYPE: ${PUSH_TYPE:-pushplus}
      PUSHPLUS_TOKEN: ${PUSHPLUS_TOKEN}
      SERVERCHAN_KEY: ${SERVERCHAN_KEY}
      # AI 助手（DeepSeek）
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-chat}
      # 注册策略：REGISTER_ENABLED=false 关闭注册；REGISTER_REQUIRES_APPROVAL=true 注册需管理员审批
      REGISTER_ENABLED: ${REGISTER_ENABLED:-true}
      REGISTER_REQUIRES_APPROVAL: ${REGISTER_REQUIRES_APPROVAL:-true}
      # SQLite 落在 data 目录，不能用卷挂载 /app/database，否则会遮蔽代码
      DATABASE_URL: ${DATABASE_URL:-sqlite:////app/data/carbon_factory.db}
    volumes:
      # 原始/处理数据、模型权重、日志、图表、SQLite 数据库文件
      - ./data:/app/data
      - ./output:/app/output
    depends_on: [algo]
    networks: [app]

  web:
    build:
      context: .
      dockerfile: deploy/Dockerfile.web
    ports:
      # 对外用 8080，避开境内服务器未备案时 80 端口的拦截
      - "8080:80"
      # 配置 HTTPS 后开启 443（证书在 nginx.conf 中挂载）
      # - "443:443"
    depends_on: [backend]
    networks: [app]

networks:
  app: